name: Production Readiness CI

on:
  push:
    branches:
      - main
      - production-readiness-foundations
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, lint and build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-000000000000000000000000
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-000000000000000000
      DATABASE_URL: postgresql://postgres:postgres@example.supabase.co:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@example.supabase.co:5432/postgres
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
